[package]
name = "quipclip"
# The only copy of the application version. Tauri reads it here, because tauri.conf.json has
# no `version` field. Change it with `pnpm version:bump`, which also updates Cargo.lock.
version = "0.1.0"
description = "Mark in and out points on a video, then export the segments joined in order."
authors = ["capric98"]
edition = "2021"
# Layer 2 of `fsutil::replace_file` needs the POSIX-semantics path `fs::rename` gained in
# 1.85 (ADR 015), in rust-lang/rust#131072. An older toolchain builds and loses it with no
# diagnostic. Cite the pull request so a later reader can re-check the floor without a Windows
# machine. Declaring `rust-version` also switches on `clippy::incompatible_msrv` crate-wide, so
# under `-D warnings` any future use of a std API stabilised after 1.85 becomes a build failure.
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quipclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.5"

# The measurement of the macOS window buttons at startup (`traffic_lights.rs`, ADR 020). It
# reads the frame of the standard close button through AppKit. tauri, tao and wry already
# depend on these three crates at these versions, so the lock file gains no package. The
# features are the AppKit classes that the measurement uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

