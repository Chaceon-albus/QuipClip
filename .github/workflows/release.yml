name: Release

# Publishes one immutable release for each pushed tag v<version>. Details:
# docs/releasing.md (steps, and what to do when a job fails) and ADR 034 (rules).
#
# Setup, one time: Settings > General > Releases > Enable release immutability.
# Optional: add required reviewers to the "release" environment.
#
# Release: pnpm version:bump <major|minor|patch>, commit, and push to main. When CI
# passes, tag and push:
#   git tag -a v0.2.0 -m "QuipClip 0.2.0" && git push origin v0.2.0
#
# The jobs run in this order: check the tag, run CI on the tagged commit, build the
# bundles, attach them to a draft release, and publish the draft. Only the publish makes
# the release immutable. After it, nobody can add, change, or delete an asset.
#
# Only the draft and publish jobs have a token that can write. They run no build code:
# only the scripts of this repository, gh, and curl. The build jobs can only read.
# Each action is pinned to a commit, and the comment gives its version.

on:
  push:
    tags: ["v*"]

# A new push of the same tag stops the old run. The group name differs from the CI
# group, because the CI jobs run inside this run.
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The check that main contains the tagged commit needs the history of main.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Check the version and the tag name
        run: node scripts/version.mjs check --tag "$GITHUB_REF_NAME"

      - name: Check the tag and its commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)
          if [ "$type" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is not an annotated tag. Make it with git tag -a."
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$GITHUB_REF_NAME" --jq .sha)
          if [ "$tagged" != "$sha" ]; then
            echo "::error::$GITHUB_REF_NAME points at $tagged, not at the checked out $sha."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::main does not contain $sha. Tag a commit on main."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  ci:
    name: ci
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.name }})
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # A failed platform does not stop the others. "Re-run failed jobs" then builds only
      # the platforms that failed.
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache in this job. A release builds from a clean state, so a cache
      # that a different run wrote cannot change a published bundle.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # This step stops when Cargo.lock does not agree with Cargo.toml. The build then
      # cannot change the lock file without a message.
      - run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - run: pnpm tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          # A re-run of this job replaces the artifact of the failed attempt, so the draft
          # job cannot get a stale bundle.
          overwrite: true
          # GitHub allows a re-run for 30 days, so the bundles stay for that time.
          retention-days: 30

  draft:
    name: attach the bundles to a draft
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true

      - name: Check the bundles
        run: node scripts/release-assets.mjs files bundles

      # A second run finds the draft of the first run and uses it again. A published
      # release is final, so the job stops when one exists for this tag.
      - name: Find or make the draft release
        id: draft
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          if grep -q ' false$' <<<"$releases"; then
            echo "::error::A published release for $TAG exists. Do not run this workflow again for $TAG."
            exit 1
          fi
          drafts=$(grep -c ' true$' <<<"$releases" || true)
          if [ "$drafts" -gt 1 ]; then
            echo "::error::$drafts draft releases for $TAG exist. Delete all but one."
            exit 1
          fi
          id=$(awk '$2 == "true" { print $1 }' <<<"$releases")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$SHA" \
              -f name="QuipClip ${TAG#v}" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq .id)
            echo "Made draft release $id."
          else
            # The tag can move before the publish. Keep the draft on the checked commit.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f target_commitish="$SHA" --jq .id > /dev/null
            echo "Found draft release $id."
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # The draft is not immutable yet, so this step can delete its old assets. The
      # upload uses the release id, so it cannot reach a different release.
      - name: Attach the bundles
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | "\(.id) \(.name)"' |
            while read -r asset_id asset_name; do
              echo "Deleting the old asset $asset_name."
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" </dev/null
            done
          node scripts/release-assets.mjs files bundles |
            while read -r file; do
              name=$(basename "$file")
              echo "Uploading $name."
              curl --fail-with-body --silent --show-error --output /dev/null \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
                </dev/null
            done

      # GitHub can give the digest of a new asset a short time after the upload, so the
      # check tries again three times.
      - name: Check the assets of the draft
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
                --jq '.[]' | jq -s . > "$RUNNER_TEMP/assets.json" &&
              node scripts/release-assets.mjs draft "$RUNNER_TEMP/assets.json" bundles; then
              exit 0
            fi
            [ "$attempt" -lt 4 ] && sleep 10
          done
          exit 1

  publish:
    name: publish the release
    needs: [verify, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to this environment in the repository settings. The job then
    # waits, and a reviewer can inspect the draft before the publish.
    environment: release
    permissions:
      contents: write
      # gh release verify reads the release attestation.
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      SHA: ${{ needs.verify.outputs.sha }}
      RELEASE_ID: ${{ needs.draft.outputs.id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # The same bundles that the draft job attached. The check below compares their
      # digests with the digests of the draft assets.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true

      # The approval wait can be long. This step checks the draft again, and it checks the
      # tag immediately before the publish. When a check fails, nothing is published.
      - name: Check the draft and the tag, and publish the draft
        run: |
          set -euo pipefail
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)
          if [ "$draft" != "true" ]; then
            echo "::error::Release $RELEASE_ID is published already. Do not delete it. Look for the Immutable label on the Releases page."
            exit 1
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[]' | jq -s . > "$RUNNER_TEMP/assets.json"
          node scripts/release-assets.mjs draft "$RUNNER_TEMP/assets.json" bundles

          # The release becomes Latest only when no other published release has a higher
          # version. The list holds only published releases that are not pre-releases.
          version="${TAG#v}"
          # The gh call stands on its own line, so that set -e stops the step on an error.
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          highest=$(printf '%s\n' $published "$TAG" |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
          if [ "$highest" = "$version" ]; then make_latest=true; else make_latest=false; fi
          echo "The highest published version is $highest. Latest: $make_latest."

          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          if [ "$tagged" != "$SHA" ]; then
            echo "::error::$TAG now points at $tagged, not at the built $SHA. Nothing is published."
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest="$make_latest" \
            --jq .html_url

      # From this step on, the release is published. A failure here does not make the
      # release wrong. Do not run this workflow again, and do not delete the release.
      - name: Check that the release is immutable
        run: |
          for attempt in 1 2 3 4 5 6; do
            immutable=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .immutable || true)
            if [ "$immutable" = "true" ]; then
              echo "$TAG is immutable."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$TAG is published, but the API does not show it as immutable. Look for the Immutable label on the Releases page before you do anything."
          exit 1

      - name: Verify the release attestation
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::gh release verify failed for $TAG. The release is published. Do not run this workflow again. Run gh release verify by hand."
          exit 1
